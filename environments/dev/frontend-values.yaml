nameOverride: frontend
fullnameOverride: frontend
replicaCount: 1

image:
  repository: ghcr.io/mahesh-newdevops/frontend
  tag: latest

env:
  SERVICE_NAME: frontend
  PORT: "80"

service:
  port: 80
  targetPort: 80

health:
  path: /

ingress:
  enabled: true
  className: nginx
  host: microservices.local
  path: /
