name: Build And Publish Images

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: mahesh-newdevops

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
          fi

          if [[ -z "${base_sha}" || "${base_sha}" == "0000000000000000000000000000000000000000" ]]; then
            base_sha="$(git rev-list --max-parents=0 HEAD)"
          fi

          changed_files="$(git diff --name-only "${base_sha}" "${GITHUB_SHA}")"
          services=()

          for service in user-service order-service payment-service notification-service frontend; do
            if grep -qE "^services/${service}/" <<< "${changed_files}"; then
              services+=("${service}")
            fi
          done

          if [[ "${#services[@]}" -eq 0 ]]; then
            echo 'services=[]' >> "${GITHUB_OUTPUT}"
            echo 'has_changes=false' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          json="$(python3 -c 'import json, sys; print(json.dumps(sys.argv[1:]))' "${services[@]}")"
          echo "services=${json}" >> "${GITHUB_OUTPUT}"
          echo 'has_changes=true' >> "${GITHUB_OUTPUT}"

  build:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.service }}:latest

  update-dev-tags:
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect-changes.outputs.has_changes == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update dev image tags
        env:
          CHANGED_SERVICES: ${{ needs.detect-changes.outputs.services }}
        run: |
          set -euo pipefail

          mapfile -t services < <(python3 -c 'import json, os; print("\n".join(json.loads(os.environ["CHANGED_SERVICES"])))')

          for service in "${services[@]}"; do
            values_file="environments/dev/${service}-values.yaml"
            image="${REGISTRY}/${IMAGE_OWNER}/${service}"

            sed -i "s|^  repository: .*|  repository: ${image}|" "${values_file}"
            sed -i "s|^  tag: .*|  tag: ${GITHUB_SHA}|" "${values_file}"
          done

      - name: Commit updated tags
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No image tag changes to commit."
            exit 0
          fi

          git add environments/dev/*-values.yaml
          git commit -m "chore: update dev image tags to ${GITHUB_SHA} [skip ci]"
          git push
