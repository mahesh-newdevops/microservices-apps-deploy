nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: ghcr.io/mahesh-newdevops/microservice
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

env:
  SERVICE_NAME: microservice
  PORT: "3000"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

ingress:
  enabled: false
  className: nginx
  annotations: {}
  host: ""
  path: /
  pathType: Prefix

health:
  path: /health
